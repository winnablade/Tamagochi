<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagochi</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="#">
</head>
<body>
    <main>
        <section>
            <h1>TamaGochi</h1><br>
            <p id="name">---</p>

            <div class="tamagochi-icons">
                <img src="" alt="">
            </div>
        </section>
        <section id="stats">
            <div>
                <img src="" alt="">
            <!--<img src="icons/moon-icon.png" alt="">-->
                <p>sleep <span id="sleepStat">100</span></p>
            </div>
            <div>
                <!--<img src="icons/fork-icon.png" alt="">-->
                <p>starve <span id="starveStat">0</span></p>
            </div>
            <div>
                <!--<img src="icons/heart-icon.png" alt="">-->
                <p>love <span id="loveStat">100</span></p>
            </div>
        </section>
        <section>
            <div>
                <p id="status"></p>
            </div>
        </section>
        <section id="buttons">
            <div class="action">
                <!--<img id="bed-icon" src="icons/bed-icon.png" alt="">-->
                <button id="sleepBtn" aria-label="Sleep">Sleep</button>
            </div>
            <div class="action">
                <!--<img id="food-icon" src="icons/food-icon.png" alt="">-->
                <button id="feedBtn" aria-label="Feed">Feed</button>
            </div>
            <div class="action">
                <!--<img src="icons/hand-icon.png" alt="">-->
                <button id="petBtn" aria-label="Pet">Pet</button>
            </div>
        </section>
    </main>
</body>
</html>
